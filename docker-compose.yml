services:
  api:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fqsaas
      - HERMES_ORCHESTRATOR_URL=http://hermes-orchestrator:8788
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

  worker:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fqsaas
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fqsaas
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app
    command: celery -A app.celery_app worker --loglevel=info --pool=solo

  beat:
    build: .
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fqsaas
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fqsaas
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
    command: celery -A app.celery_app beat --loglevel=info

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fqsaas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
