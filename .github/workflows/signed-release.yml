name: Signed On-Prem Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable semantic release version
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      UPDATE_FEED_URL: ${{ vars.DESKTOP_UPDATE_FEED_URL }}
      API_URL: ${{ vars.DESKTOP_API_URL }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      DESKTOP_RELEASE_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run release:check
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-signed
          path: desktop/dist/FQ-SaaS Workspace-Setup-*.exe
          if-no-files-found: error

  offline-bundle:
    needs: desktop-windows
    runs-on: ubuntu-latest
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-signed
          path: release-input/desktop
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Build, mirror, and sign immutable images
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version || github.ref_name }}"; version="${version#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$repo/api:$version" .
          docker build -t "$repo/admin:$version" frontend
          docker build -f Dockerfile.hermes-runtime -t "$repo/runtime:$version" .
          for item in "api|$repo/api:$version" "admin|$repo/admin:$version" "runtime|$repo/runtime:$version" \
            "caddy|caddy:2.8-alpine" "postgres|postgres:15-alpine" "redis|redis:7-alpine"; do
            name="${item%%|*}"; source="${item#*|}"; target="$repo/$name:$version"
            docker pull "$source" >/dev/null 2>&1 || true
            docker tag "$source" "$target" 2>/dev/null || true
            docker push "$target"
            docker pull "$target"
            ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$target")"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$ref"
            echo "${name^^}_IMAGE=$ref" >> "$GITHUB_ENV"
          done
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build signed offline bundle and SBOMs
        shell: bash
        run: |
          export AGENTSAAS_API_IMAGE="$API_IMAGE"
          export AGENTSAAS_ADMIN_IMAGE="$ADMIN_IMAGE"
          export AGENTSAAS_HERMES_RUNTIME_IMAGE="$RUNTIME_IMAGE"
          export AGENTSAAS_CADDY_IMAGE="$CADDY_IMAGE"
          export AGENTSAAS_POSTGRES_IMAGE="$POSTGRES_IMAGE"
          export AGENTSAAS_REDIS_IMAGE="$REDIS_IMAGE"
          export COSIGN_PUBLIC_KEY="$PWD/cosign.pub"
          export AGENTSAAS_SCHEMA_REVISION="knowledge_connectors"
          export AGENTSAAS_SCHEMA_COMPATIBLE_FROM="evaluation_gates,knowledge_connectors"
          export AGENTSAAS_DESKTOP_VERSION="$RELEASE_VERSION"
          export AGENTSAAS_DESKTOP_ARTIFACT="$(find release-input/desktop -type f -name '*.exe' -print -quit)"
          bash deploy/build_offline_bundle.sh "$RELEASE_VERSION" release-output env://COSIGN_PRIVATE_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: agentsaas-${{ env.RELEASE_VERSION }}-signed-offline
          path: |
            release-output/agentsaas-*-offline.tar.gz
            cosign.pub
          if-no-files-found: error
