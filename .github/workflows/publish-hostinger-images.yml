name: Publish Hostinger Images

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/publish-hostinger-images.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "Dockerfile.hermes-runtime"
      - "requirements.txt"
      - "alembic.ini"
      - "migrations/**"
      - "app/**"
      - "scripts/**"
      - "seed_templates.py"
      - "frontend/**"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: hostinger-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: Dockerfile
            build_args: ""
          - image: admin
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=/api
              NEXT_PUBLIC_API_ORIGIN=http://api:8000
              NEXT_PUBLIC_DESKTOP_WINDOWS_DOWNLOAD_URL=${{ vars.DESKTOP_WINDOWS_DOWNLOAD_URL }}
              NEXT_PUBLIC_DESKTOP_MAC_DOWNLOAD_URL=${{ vars.DESKTOP_MAC_DOWNLOAD_URL }}
          - image: runtime
            context: .
            dockerfile: Dockerfile.hermes-runtime
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

