services:
  migrate:
    image: agentsaas-api:e2e
    pull_policy: never
    env_file:
      - .env.docker.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python seed_templates.py"
    networks:
      - app_net

  storage-init:
    image: agentsaas-api:e2e
    pull_policy: never
    user: "0:0"
    command: sh -c "mkdir -p /data/attachments /data/hermes/profiles /data/knowledge && chown -R 10001:10001 /data/attachments /data/hermes/profiles /data/knowledge"
    volumes:
      - attachment_data_e2e:/data/attachments
      - hermes_profiles:/data/hermes/profiles
      - knowledge_data_e2e:/data/knowledge

  api:
    image: agentsaas-api:e2e
    build: .
    ports:
      - "8002:8000"
    env_file:
      - .env.docker.local
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HERMES_ORCHESTRATOR_URL: http://hermes-orchestrator:8788
      HERMES_ORCHESTRATOR_SECRET: ${HERMES_ORCHESTRATOR_SECRET}
      ATTACHMENT_STORAGE_ROOT: /data/attachments
      TELEGRAM_WEBHOOK_SECRET: desktop-e2e-telegram-webhook-secret-2026
      KNOWLEDGE_ALLOWED_ROOTS: '["/data/knowledge"]'
    volumes:
      - attachment_data_e2e:/data/attachments
      - knowledge_data_e2e:/data/knowledge:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      hermes-orchestrator:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - app_net

  admin:
    image: agentsaas-admin:e2e
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002/api
    ports:
      - "3002:3000"
    env_file:
      - .env.docker.local
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - app_net

  worker:
    image: agentsaas-api:e2e
    pull_policy: never
    env_file:
      - .env.docker.local
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      KNOWLEDGE_ALLOWED_ROOTS: '["/data/knowledge"]'
    volumes:
      - knowledge_data_e2e:/data/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    networks:
      - app_net

  beat:
    image: agentsaas-api:e2e
    pull_policy: never
    env_file:
      - .env.docker.local
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    networks:
      - app_net

  hermes-orchestrator:
    image: agentsaas-api:e2e
    pull_policy: never
    environment:
      HERMES_WORKSPACE_ROOT: /data/hermes/profiles
      HERMES_PORT: 8787
      HERMES_INTERNAL_URL: http://hermes-runtime:8787
      HERMES_RUNTIME_SECRET: ${HERMES_RUNTIME_SECRET:-desktop-e2e-hermes-runtime-secret-2026}
      HERMES_ORCHESTRATOR_SECRET: ${HERMES_ORCHESTRATOR_SECRET}
      HERMES_ORCHESTRATOR_REQUIRE_SECRET: "true"
      HERMES_MODEL_PROXY_URL: http://hermes-orchestrator:8788/internal/model/v1/chat/completions
      OPENAI_BASE_URL: http://host.docker.internal:60000/v1/chat/completions
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1/chat/completions}
      HERMES_MANAGED_EXTERNALLY: "true"
      HERMES_RUN_PATH: /runs
      HERMES_RUN_STREAM_PATH: /runs/stream
      HERMES_HEALTH_PATH: /health
    volumes:
      - hermes_profiles:/data/hermes/profiles
    depends_on:
      hermes-runtime:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    command: uvicorn app.hermes_orchestrator_app:app --host 0.0.0.0 --port 8788
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/readyz', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - app_net
      - runtime_net

  hermes-runtime:
    image: agentsaas-hermes-runtime:e2e
    build:
      context: .
      dockerfile: Dockerfile.hermes-runtime
    environment:
      DEFAULT_MODEL: ${DEFAULT_MODEL}
      HERMES_PROFILES_ROOT: /data/hermes/profiles
      HERMES_RUN_TIMEOUT_SECONDS: 120
      HERMES_RUNTIME_SECRET: ${HERMES_RUNTIME_SECRET:-desktop-e2e-hermes-runtime-secret-2026}
      HERMES_RUNTIME_REQUIRE_SECRET: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.local_hermes_runtime_app:app --host 0.0.0.0 --port 8787
    volumes:
      - hermes_profiles:/data/hermes/profiles:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)\""]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - runtime_net

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "55434:5432"
    volumes:
      - postgres_data_e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data_e2e:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - app_net

volumes:
  postgres_data_e2e:
  redis_data_e2e:
  hermes_profiles:
  attachment_data_e2e:
  knowledge_data_e2e:

networks:
  app_net:
  runtime_net:
