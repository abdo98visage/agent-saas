services:
  api:
    build: .
    ports:
      - "8002:8000"
    environment:
      APP_NAME: FQ-SaaS E2E
      DEBUG: "False"
      SECRET_KEY: e2e-secret-key-change-for-real-deployments
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      POSTGRES_PASSWORD: e2e-postgres-password
      DATABASE_URL: postgresql+asyncpg://postgres:e2e-postgres-password@db:5432/fqsaas_e2e
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: openai
      DEFAULT_MODEL: Qwen3.6-27B-IQ4_XS.gguf
      OPENAI_API_KEY: e2e-openai-compatible-placeholder
      OPENAI_BASE_URL: http://host.docker.internal:54175/v1/chat/completions
      FERNET_KEY: 2Uj8y8t2eL4LTb_EYxZ2Pgoj2AbG0AgtEAGlVKYcJL8=
      HERMES_ORCHESTRATOR_URL: http://hermes-orchestrator:8788
      HERMES_ORCHESTRATOR_SECRET: e2e-hermes-orchestrator-secret-32chars-minimum
      HERMES_REQUEST_TIMEOUT_SECONDS: "120"
      ALLOWED_ORIGINS: '["http://localhost:3002","http://127.0.0.1:3002"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      hermes-orchestrator:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python seed_templates.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - e2e_net

  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002/api
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8002/api
    depends_on:
      api:
        condition: service_healthy
    networks:
      - e2e_net

  hermes-orchestrator:
    build: .
    environment:
      HERMES_WORKSPACE_ROOT: /data/hermes/profiles
      HERMES_CONTAINER: agentsaas-local-hermes-runtime
      HERMES_IMAGE: local/agentsaas-hermes-runtime:e2e
      HERMES_INTERNAL_URL: http://hermes-runtime:8787
      HERMES_ORCHESTRATOR_SECRET: e2e-hermes-orchestrator-secret-32chars-minimum
      HERMES_ORCHESTRATOR_REQUIRE_SECRET: "true"
      HERMES_MANAGED_EXTERNALLY: "true"
      HERMES_RUN_PATH: /runs
      HERMES_RUN_STREAM_PATH: /runs/stream
      HERMES_HEALTH_PATH: /health
    volumes:
      - e2e_hermes_profiles:/data/hermes/profiles
    depends_on:
      hermes-runtime:
        condition: service_healthy
    command: uvicorn app.hermes_orchestrator_app:app --host 0.0.0.0 --port 8788
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - e2e_net

  hermes-runtime:
    build: .
    command: uvicorn app.local_hermes_runtime_app:app --host 0.0.0.0 --port 8787
    environment:
      DEFAULT_MODEL: Qwen3.6-27B-IQ4_XS.gguf
      OPENAI_BASE_URL: http://host.docker.internal:54175/v1/chat/completions
    volumes:
      - e2e_hermes_profiles:/data/hermes/profiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      e2e_net:
        aliases:
          - agentsaas-local-hermes-runtime

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e-postgres-password
      POSTGRES_DB: fqsaas_e2e
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fqsaas_e2e"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data
    networks:
      - e2e_net

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - e2e_redis_data:/data
    networks:
      - e2e_net

volumes:
  e2e_postgres_data:
  e2e_redis_data:
  e2e_hermes_profiles:

networks:
  e2e_net:
    name: agentsaas_e2e
