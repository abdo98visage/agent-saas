services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      app_net:
        ipv4_address: ${AGENTSAAS_PROXY_IP:-172.30.0.2}
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  migrate:
    build: .
    env_file:
      - ${AGENTSAAS_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    command: alembic upgrade head
    restart: "no"

  storage-init:
    build: .
    user: "0:0"
    command: sh -c "mkdir -p /data/attachments /data/hermes/profiles /data/knowledge && chown -R 10001:10001 /data/attachments /data/hermes/profiles /data/knowledge"
    volumes:
      - attachment_data:/data/attachments
      - hermes_profiles:/data/hermes/profiles
      - knowledge_data:/data/knowledge
    restart: "no"

  api:
    build: .
    env_file:
      - ${AGENTSAAS_ENV_FILE:-.env.production}
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HERMES_ORCHESTRATOR_URL: http://hermes-orchestrator:8788
      HERMES_ORCHESTRATOR_SECRET: ${HERMES_ORCHESTRATOR_SECRET}
      ATTACHMENT_STORAGE_ROOT: /data/attachments
    volumes:
      - attachment_data:/data/attachments
      - knowledge_data:/data/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      hermes-orchestrator:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    networks:
      - app_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${AGENTSAAS_PROXY_IP:-172.30.0.2}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5

  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1

  worker:
    build: .
    env_file:
      - ${AGENTSAAS_ENV_FILE:-.env.production}
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      KNOWLEDGE_ALLOWED_ROOTS: '["/data/knowledge"]'
    volumes:
      - knowledge_data:/data/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1

  beat:
    build: .
    env_file:
      - ${AGENTSAAS_ENV_FILE:-.env.production}
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_net
    command: celery -A app.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5

  hermes-orchestrator:
    build: .
    environment:
      HERMES_WORKSPACE_ROOT: /data/hermes/profiles
      HERMES_PORT: ${HERMES_PORT:-8787}
      HERMES_INTERNAL_URL: http://hermes-runtime:${HERMES_PORT:-8787}
      HERMES_RUNTIME_SECRET: ${HERMES_RUNTIME_SECRET}
      HERMES_ORCHESTRATOR_SECRET: ${HERMES_ORCHESTRATOR_SECRET}
      HERMES_ORCHESTRATOR_REQUIRE_SECRET: "true"
      HERMES_MODEL_PROXY_URL: http://hermes-orchestrator:8788/internal/model/v1/chat/completions
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1/chat/completions}
      HERMES_MANAGED_EXTERNALLY: "true"
      HERMES_RUN_PATH: ${HERMES_RUN_PATH:-/runs}
      HERMES_RUN_STREAM_PATH: ${HERMES_RUN_STREAM_PATH:-/runs/stream}
      HERMES_HEALTH_PATH: ${HERMES_HEALTH_PATH:-/health}
    volumes:
      - hermes_profiles:/data/hermes/profiles
    depends_on:
      hermes-runtime:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - app_net
      - runtime_net
    command: uvicorn app.hermes_orchestrator_app:app --host 0.0.0.0 --port 8788
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/readyz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5

  hermes-runtime:
    build:
      context: .
      dockerfile: Dockerfile.hermes-runtime
    environment:
      HERMES_PROFILES_ROOT: /data/hermes/profiles
      HERMES_RUN_TIMEOUT_SECONDS: ${HERMES_RUN_TIMEOUT_SECONDS:-120}
      HERMES_RUNTIME_SECRET: ${HERMES_RUNTIME_SECRET}
      HERMES_RUNTIME_REQUIRE_SECRET: "true"
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3-14b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    command: uvicorn app.local_hermes_runtime_app:app --host 0.0.0.0 --port 8787
    volumes:
      - hermes_profiles:/data/hermes/profiles:ro
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      - runtime_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  hermes_profiles:
  attachment_data:
  knowledge_data:

networks:
  app_net:
    name: ${AGENTSAAS_DOCKER_NETWORK:-agentsaas_private}
    ipam:
      config:
        - subnet: ${AGENTSAAS_DOCKER_SUBNET:-172.30.0.0/24}
  runtime_net:
    name: ${AGENTSAAS_RUNTIME_DOCKER_NETWORK:-agentsaas_runtime}
