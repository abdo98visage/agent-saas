services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - app_net
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HERMES_ORCHESTRATOR_URL: http://hermes-orchestrator:8788
      HERMES_ORCHESTRATOR_SECRET: ${HERMES_ORCHESTRATOR_SECRET}
    depends_on:
      - db
      - redis
      - hermes-orchestrator
    networks:
      - app_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env.production
    depends_on:
      - api
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
      - redis
    networks:
      - app_net
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped

  beat:
    build: .
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - redis
    networks:
      - app_net
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped

  hermes-orchestrator:
    build: .
    env_file:
      - .env.production
    environment:
      HERMES_WORKSPACE_ROOT: /data/hermes/profiles
      HERMES_CONTAINER: agent-saas-hermes
      HERMES_IMAGE: ${HERMES_IMAGE:-ghcr.io/hermes-agent/hermes:latest}
      HERMES_PORT: ${HERMES_PORT:-8787}
      HERMES_INTERNAL_URL: http://agent-saas-hermes:${HERMES_PORT:-8787}
      HERMES_DOCKER_NETWORK: ${AGENTSAAS_DOCKER_NETWORK:-agentsaas_private}
      HERMES_PUBLISH_PORT: "false"
      HERMES_ORCHESTRATOR_SECRET: ${HERMES_ORCHESTRATOR_SECRET}
      HERMES_ORCHESTRATOR_REQUIRE_SECRET: "true"
      HERMES_RUN_PATH: ${HERMES_RUN_PATH:-/runs}
      HERMES_RUN_STREAM_PATH: ${HERMES_RUN_STREAM_PATH:-/runs/stream}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hermes_profiles:/data/hermes/profiles
    networks:
      - app_net
    command: uvicorn app.hermes_orchestrator_app:app --host 0.0.0.0 --port 8788
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  hermes_profiles:

networks:
  app_net:
    name: ${AGENTSAAS_DOCKER_NETWORK:-agentsaas_private}
