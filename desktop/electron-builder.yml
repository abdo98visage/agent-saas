appId: com.fqsaas.desktop
productName: FQ-SaaS Workspace
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - desktop-config.json
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  category: public.app-category.productivity
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
