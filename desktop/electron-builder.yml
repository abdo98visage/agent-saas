appId: com.fqsaas.desktop
productName: FQ-SaaS Workspace
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - desktop-config.json
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
